name: PlexTrac, LLC
description: 'PlexTrac is a penetration test reporting and proactive exposure management
  platform that unifies offensive security data from pentests, vulnerability scanners,
  and bug bounty programs into a single system of record. It automates pentest report
  authoring (including AI-assisted findings), centralizes and prioritizes vulnerability
  data by business impact, and drives remediation through workflows integrated with
  tools such as Jira and ServiceNow. PlexTrac exposes a JWT-authenticated REST API
  (v1 and v2) for managing clients, reports, findings, assets, and content-library
  writeups, plus RBAC/tenant administration and outbound webhooks, letting security
  teams and MSSPs integrate reporting and remediation into their own pipelines.'
